events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        location / {
            proxy_pass http://frontend:51118/;
        }

        location /api/ {
            proxy_pass http://backend:5003/;
        }

        location /llama-server/ {
            proxy_pass http://llamacpp:8000/;
        }

        location /elasticsearch/ {
            proxy_pass http://elasticsearch:9200/;
        }
    }
}
